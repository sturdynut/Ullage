# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keep the shared review policy, with scoped files and docstrings disabled.
inheritance: true

reviews:
  finishing_touches:
    docstrings:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "**/*.{swift,c,h,sh,py}"
    - "Taskfile.yml"
    - ".github/workflows/*.{yml,yaml}"
    - "!docs/**"
    - "!assets/**"
    - "!Tests/Fixtures/**"
    - "!**/.build/**"
    - "!**/.swiftpm/**"
    - "!**/DerivedData/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/xcuserdata/**"
    - "!**/Generated/**"
    - "!**/*.generated.swift"
    - "!Sources/UllageCore/ModelWindows.swift"
    - "!Sources/UllageCore/WebIcon.swift"
